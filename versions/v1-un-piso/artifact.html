<style>
  :root {
    --ink: #f4f0e6;
    --ink-dim: #b9b0c4;
    --panel: #241a2b;
    --panel-light: #3a2d46;
    --gold: #e8c25a;
    --red: #e0453e;
    --game-w: 768px;
    --game-h: 448px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #15101d;
    color: var(--ink);
    font-family: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px;
  }

  #stage {
    position: relative;
    width: var(--game-w);
    height: var(--game-h);
    flex: none;
    box-shadow: 0 0 0 3px var(--panel-light), 0 12px 40px rgba(0, 0, 0, 0.6);
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .layer {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6%;
    gap: 14px;
  }

  #title-screen, #end-screen {
    background: rgba(21, 16, 29, 0.93);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  #title-screen.is-visible, #end-screen.is-visible {
    opacity: 1;
    pointer-events: auto;
  }

  .title-main {
    font-size: clamp(20px, 5.2vw, 40px);
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--gold);
    text-shadow: 3px 3px 0 #7a4f2c;
    margin: 0;
  }

  .title-sub {
    font-size: clamp(12px, 2.4vw, 17px);
    color: var(--ink);
    letter-spacing: 0.08em;
    margin: 0;
  }

  .title-prompt {
    font-size: clamp(10px, 2vw, 14px);
    color: var(--ink-dim);
    animation: blink 1.3s steps(2, end) infinite;
    margin: 0;
  }

  @keyframes blink { 50% { opacity: 0.25; } }

  .heart-row { font-size: clamp(14px, 3vw, 22px); letter-spacing: 0.3em; }

  #hud {
    position: absolute;
    top: 8px;
    left: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: rgba(36, 26, 43, 0.86);
    border: 2px solid var(--panel-light);
    font-size: clamp(10px, 1.7vw, 14px);
    letter-spacing: 0.06em;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  #hud.is-visible { opacity: 1; }
  #hud.is-complete { border-color: var(--gold); color: var(--gold); }

  #dialogue {
    position: absolute;
    left: 3%;
    right: 3%;
    bottom: 3%;
    background: var(--panel);
    border: 3px solid var(--gold);
    padding: 12px 14px 14px;
    text-align: left;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  #dialogue.is-open { opacity: 1; transform: translateY(0); pointer-events: auto; }

  #dialogue-name {
    color: var(--gold);
    font-size: clamp(10px, 1.8vw, 14px);
    font-weight: 700;
    letter-spacing: 0.12em;
    margin-bottom: 6px;
  }

  #dialogue-text {
    font-size: clamp(11px, 2vw, 16px);
    line-height: 1.55;
    min-height: 3.1em;
    margin: 0;
  }

  #dialogue-next {
    position: absolute;
    right: 12px;
    bottom: 8px;
    color: var(--gold);
    font-size: clamp(10px, 1.6vw, 14px);
    opacity: 0;
  }

  #dialogue-next.is-ready { opacity: 1; animation: blink 1s steps(2, end) infinite; }

  .end-line { margin: 0; font-size: clamp(11px, 2.1vw, 16px); }
  #end-credits { color: var(--gold); letter-spacing: 0.1em; font-size: clamp(11px, 2.2vw, 17px); }
  #end-dedication { color: var(--ink-dim); font-size: clamp(10px, 1.8vw, 14px); }

  button {
    font-family: inherit;
    font-size: clamp(11px, 1.9vw, 15px);
    color: var(--ink);
    background: var(--panel-light);
    border: 2px solid var(--gold);
    padding: 9px 18px;
    cursor: pointer;
    letter-spacing: 0.06em;
  }

  button:hover { background: var(--gold); color: var(--panel); }

  button:focus-visible, #stage:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 3px;
  }

  #controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: var(--game-w);
    max-width: 100%;
    gap: 12px;
  }

  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 46px);
    grid-template-rows: repeat(3, 46px);
    gap: 3px;
  }

  #dpad button, #act {
    background: var(--panel-light);
    border: 2px solid #55456a;
    color: var(--ink);
    font-size: 17px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    touch-action: none;
  }

  #dpad button.is-pressed, #act.is-pressed { background: var(--gold); color: var(--panel); }

  .pad-up { grid-area: 1 / 2; }
  .pad-left { grid-area: 2 / 1; }
  .pad-right { grid-area: 2 / 3; }
  .pad-down { grid-area: 3 / 2; }

  #act {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border-color: var(--gold);
    font-size: 15px;
    font-weight: 700;
  }

  .hint {
    font-size: 12px;
    color: var(--ink-dim);
    text-align: center;
    letter-spacing: 0.05em;
  }

  #mute {
    position: fixed;
    top: 10px;
    right: 10px;
    padding: 6px 10px;
    font-size: 15px;
    border-color: var(--panel-light);
    z-index: 5;
  }

  @media (hover: hover) and (pointer: fine) {
    #dpad, #act { display: none; }
    #controls { justify-content: center; }
  }

  @media (max-width: 720px) {
    .hint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .title-prompt, #dialogue-next.is-ready { animation: none; }
    #dialogue, #title-screen, #end-screen, #hud { transition: none; }
  }
</style>
<button id="mute" aria-label="Silenciar">🔊</button>

<div id="stage">
  <canvas id="game" aria-label="Oficina de Hired Experts"></canvas>

  <div id="hud"><span>❤</span><span id="hud-count">0/5</span></div>

  <div id="dialogue">
    <div id="dialogue-name"></div>
    <p id="dialogue-text"></p>
    <span id="dialogue-next">▼</span>
  </div>

  <div id="title-screen" class="layer is-visible">
    <p class="heart-row">🛡 ❤ 🛡</p>
    <h1 class="title-main">HIRED EXPERTS</h1>
    <p class="title-sub">Día de Amor y Amistad</p>
    <p class="title-prompt">Presiona ENTER para entrar a la oficina</p>
  </div>

  <div id="end-screen" class="layer">
    <p class="heart-row">❤ ❤ ❤ ❤ ❤</p>
    <p class="end-line">Gracias, <strong>Hired Experts</strong>.</p>
    <p class="end-line" id="end-credits"></p>
    <p class="end-line" id="end-dedication"></p>
    <button id="replay">Volver a jugar</button>
  </div>
</div>

<div id="controls">
  <div id="dpad">
    <button class="pad-up" data-action="up" aria-label="Arriba">▲</button>
    <button class="pad-left" data-action="left" aria-label="Izquierda">◀</button>
    <button class="pad-right" data-action="right" aria-label="Derecha">▶</button>
    <button class="pad-down" data-action="down" aria-label="Abajo">▼</button>
  </div>
  <p class="hint">Flechas o WASD para caminar · E o ESPACIO para hablar</p>
  <button id="act" data-action="action" aria-label="Hablar">E</button>
</div>

<script src="src/sprites.js"></script>
<script src="src/map.js"></script>
<script src="src/messages.js"></script>
<script src="src/engine.js"></script>
<script src="src/characters.js"></script>
<script src="src/dialogue.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
